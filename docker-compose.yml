version: '3.8'
services:
  gigaclip:
    build: .
    container_name: gigaclip_studio
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./output:/app/output
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - GIGACLIP_CONFIG_DIR=/app/data
      - GIGACLIP_API_KEY=${GIGACLIP_API_KEY:-}
      - GIGACLIP_SESSION_SECRET=${GIGACLIP_SESSION_SECRET:-}
      - GIGACLIP_COOKIE_SECURE=${GIGACLIP_COOKIE_SECURE:-}
      - GIGACLIP_PUBLIC_URL=${GIGACLIP_PUBLIC_URL:-}
