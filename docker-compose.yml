version: '3.8'
services:
  gigaclip:
    build: .
    container_name: gigaclip_studio
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./output:/app/output
      - ./social_config.json:/app/social_config.json
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
